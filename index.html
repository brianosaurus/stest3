<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hello-world-rust</title>
<style>
body{margin:0;background:#1e1e2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Fira Code","Consolas",monospace;color:#cdd6f4}
.term{background:#11111b;border:1px solid #313244;border-radius:8px;width:480px;padding:20px;font-size:14px;line-height:1.6;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.prompt{color:#a6e3a1;display:block;margin-bottom:10px}
#output{color:#f5e0dc;white-space:pre-wrap;min-height:40px;margin:0 0 14px}
#runBtn{background:#89b4fa;color:#11111b;border:none;border-radius:4px;padding:8px 16px;font-weight:bold;font-family:inherit;font-size:14px;cursor:pointer}
#runBtn:hover{opacity:.9}
#runBtn:disabled{opacity:.6;cursor:default}
@media (max-width:520px){
.term{width:90vw;padding:14px;font-size:13px}
}
</style>
</head>
<body>
<div class="term">
  <span class="prompt">$ cargo run</span>
  <pre id="output"></pre>
  <button id="runBtn">cargo run</button>
</div>
<script>
const btn = document.getElementById("runBtn");
const output = document.getElementById("output");
let ran = false;

btn.addEventListener("click", () => {
  ran = true;
  output.textContent = "";
  btn.disabled = true;
  output.textContent = "   Compiling hello-world v0.1.0";
  setTimeout(() => {
    output.textContent += "\nHello, world!";
    btn.disabled = false;
  }, 600);
});
</script>
</body>
</html>
